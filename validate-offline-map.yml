name: Validar mapa offline

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "app.js"
      - "sw.js"
      - "data/chahuites-roads.geojson"
      - "vendor/leaflet/**"
      - ".github/workflows/validate-offline-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Comprobar datos del mapa
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/chahuites-roads.geojson").read_text(encoding="utf-8"))
          assert data.get("type") == "FeatureCollection"
          assert len(data.get("features", [])) > 0
          print(f"OK: {len(data['features'])} vías de OpenStreetMap")
          PY
      - name: Comprobar dependencias locales y selector
        run: |
          test -s vendor/leaflet/leaflet.js
          test -s vendor/leaflet/leaflet.css
          grep -q './vendor/leaflet/leaflet.js' index.html
          grep -q 'id="mapMode"' index.html
          grep -Eq 'const CACHE_NAME = "zr-shell-v[0-9]+"' sw.js
          echo "OK: motor de mapa, selector y caché offline presentes"
